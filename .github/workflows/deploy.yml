name: Deploy to Vercel

on:
  push:
    branches: [master]
  # Every 3 hours: redeploy once a new gameweek has finished and its
  # results are in (see `python -m fpl_predictor check`).
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

env:
  # "fpl" or "understat"; set the repository variable to flip the xG source
  # (unset means fpl, see fpl_predictor/config.py).
  XG_SOURCE: ${{ vars.XG_SOURCE }}

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for a newly finished gameweek
        id: check
        run: python -m fpl_predictor check

  deploy:
    needs: check
    # Pushes and manual runs always deploy; scheduled runs only when the
    # check says a new gameweek is ready.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard from live data
        run: python -m fpl_predictor refresh

      - name: Stage static site
        run: |
          mkdir -p site
          cp output/dashboard.html site/index.html

      - name: Deploy to production
        run: npx --yes vercel@latest deploy site --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
